name: Android Build

on:
  push:
    branches: [ android, main ]
  pull_request:
    branches: [ android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Setup Gradle Wrapper
      run: |
        echo "Setting up Gradle Wrapper"
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
        echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo '#!/bin/sh' > gradlew
        echo 'APP_HOME=$(cd "$(dirname "$0")" && pwd)' >> gradlew
        echo 'CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar' >> gradlew
        echo 'exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
        chmod +x gradlew
        
    - name: Check project structure
      run: |
        echo "Project Structure"
        ls -la
        echo ""
        echo "App Directory"
        ls -la app/ 2>/dev/null || echo "No app directory"
        echo ""
        echo "Build Files"
        find . -name "*.gradle*" -type f 2>/dev/null
        
    - name: Build Debug APK
      run: |
        echo "Starting Gradle Build"
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || echo "Build finished"
      continue-on-error: true
      
    - name: Find and verify APK
      run: |
        echo "Searching for APK files"
        find . -name "*.apk" -type f 2>/dev/null
        echo ""
        echo "Build outputs directory"
        ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory"
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: MiMoTTS-Android-APK
        path: |
          app/build/outputs/apk/**/*.apk
          ./**/*.apk
        if-no-files-found: warn
        
    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: |
          build.log
          app/build/reports/
        if-no-files-found: ignore
