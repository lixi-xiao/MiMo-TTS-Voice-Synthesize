name: Android Build

on:
  push:
    branches: [ android, main ]
  pull_request:
    branches: [ android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Check project structure
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo ""
        echo "=== App Directory ==="
        ls -la app/ 2>/dev/null || echo "No app directory"
        echo ""
        echo "=== Find gradlew ==="
        find . -name "gradlew" -type f 2>/dev/null || echo "No gradlew found"
        
    - name: Build with Gradle
      run: |
        # 查找 gradlew
        if [ -f "./gradlew" ]; then
          echo "Found gradlew in root"
          chmod +x ./gradlew
          ./gradlew assembleDebug
        elif [ -f "app/gradlew" ]; then
          echo "Found gradlew in app"
          chmod +x app/gradlew
          cd app && ./gradlew assembleDebug
        else
          echo "No gradlew found, trying system gradle"
          if [ -f "app/build.gradle.kts" ]; then
            cd app && gradle assembleDebug
          else
            gradle assembleDebug
          fi
        fi
      continue-on-error: true
      
    - name: Find APK files
      run: |
        echo "=== Searching for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null | head -20
        echo ""
        echo "=== Build outputs ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APKs"
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release APKs"
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: MiMoTTS-Android-APK
        path: |
          **/*.apk
        if-no-files-found: warn
        
    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-reports
        path: |
          **/build/reports/
          **/*.log
        if-no-files-found: ignore
