name: Android Build

on:
  push:
    branches: [ android, main ]
  pull_request:
    branches: [ android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Check project structure
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo ""
        echo "=== App Directory ==="
        ls -la app/ 2>/dev/null || echo "No app directory"
        echo ""
        echo "=== Find gradlew ==="
        find . -name "gradlew" -type f 2>/dev/null || echo "No gradlew found"
        echo ""
        echo "=== Check build files ==="
        ls -la *.gradle* 2>/dev/null || echo "No gradle files in root"
        ls -la app/*.gradle* 2>/dev/null || echo "No gradle files in app"
        
    - name: Setup Gradle Wrapper
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "Creating Gradle Wrapper..."
          mkdir -p gradle/wrapper
          
          # Download gradle wrapper jar
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar || echo "Failed to download wrapper jar"
          
          # Create gradle-wrapper.properties
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
          echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # Create simple gradlew script
          echo '#!/bin/sh' > gradlew
          echo '' >> gradlew
          echo 'APP_HOME=$(cd "$(dirname "$0")" && pwd)' >> gradlew
          echo 'CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar' >> gradlew
          echo '' >> gradlew
          echo 'exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          
          chmod +x gradlew
          echo "Gradle Wrapper created successfully"
        else
          echo "Gradle Wrapper already exists"
        fi
        
    - name: Build with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --stacktrace || echo "Build failed but continuing..."
      continue-on-error: true
      
    - name: Find APK files
      run: |
        echo "=== Searching for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null | head -20
        echo ""
        echo "=== Build outputs ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APKs"
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release APKs"
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: MiMoTTS-Android-APK
        path: |
          **/*.apk
        if-no-files-found: warn
        
    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-reports
        path: |
          **/build/reports/
          **/*.log
        if-no-files-found: ignore
