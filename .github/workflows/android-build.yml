name: Android Build

on:
  push:
    branches: [ android, main ]
  pull_request:
    branches: [ android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Setup Gradle Wrapper
      run: |
        echo "=== Setting up Gradle Wrapper ==="
        mkdir -p gradle/wrapper
        
        # Download gradle wrapper jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar || \
          echo "Failed to download wrapper jar"
        
        # Create gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
PROPS
        
        # Create gradlew script
        cat > gradlew << 'SCRIPT'
#!/bin/sh
APP_HOME=$(cd "$(dirname "$0")" && pwd)
CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
SCRIPT
        
        chmod +x gradlew
        echo "Gradle Wrapper setup complete"
        ls -la gradlew
        ls -la gradle/wrapper/
        
    - name: Check project structure
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo ""
        echo "=== App Directory ==="
        ls -la app/ 2>/dev/null || echo "No app directory"
        echo ""
        echo "=== Build Files ==="
        find . -name "*.gradle*" -type f 2>/dev/null
        
    - name: Build Debug APK
      run: |
        echo "=== Starting Gradle Build ==="
        ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log || echo "Build command finished"
        echo ""
        echo "=== Build Log End ==="
      continue-on-error: true
      
    - name: Find and verify APK
      run: |
        echo "=== Searching for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null
        
        echo ""
        echo "=== Build outputs directory ==="
        ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory"
        
        echo ""
        echo "=== APK files details ==="
        find . -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null || echo "No APK files found"
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: MiMoTTS-Android-APK
        path: |
          app/build/outputs/apk/**/*.apk
          ./**/*.apk
        if-no-files-found: warn
        
    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: |
          build.log
          app/build/reports/
          **/*.log
        if-no-files-found: ignore
